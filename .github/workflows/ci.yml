name: CI
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          pip install numpy scipy pandas matplotlib scikit-learn joblib pillow
      - name: Compile-check all modules
        run: python -m compileall -q exopipe scripts *.py tests
      - name: Run lint check
        run: ruff check .
      - name: Run test suite
        run: pytest -v tests/
      - name: Verify demo pipeline
        run: python scripts/run_pipeline.py --demo 1
