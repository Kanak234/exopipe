[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "exopipe"
version = "1.0.0"
description = "AI-enabled exoplanet transit detection pipeline for noisy TESS light curves"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7"
]

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "astropy>=5.3",
    "lightkurve>=2.4",
    "reportlab>=3.6",
    "streamlit>=1.20"
]
test = [
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "exopipe", "scripts"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.packages.find]
where = ["."]
include = ["exopipe*"]
